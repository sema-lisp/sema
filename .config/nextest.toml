# cargo-nextest
# See https://nexte.st/docs/configuration/

[profile.default]
# Ignored tests (http/llm/live) stay skipped, matching the old `cargo test`.
# Surface slow tests instead of letting them silently dominate the tail.
slow-timeout = { period = "60s", terminate-after = 3 }

# The nightly fuzz-shutdown harness (crates/sema/tests/fuzz_async_shutdown_test.rs,
# #[ignore] by default) runs hundreds of generated async programs inside one
# test; its own per-root deadlines are the hang detector, so give it headroom
# past the generic slow-test watchdog while keeping a terminal bound.
[[profile.default.overrides]]
filter = "test(fuzz_async_shutdown)"
slow-timeout = { period = "300s", terminate-after = 2 }

# Tests that spawn a `sema` or python child per test. Twelve cold 160 MB
# spawns at once stall for >10 s when the host is swapping (2026-09-09 flake:
# all 12 sema-dap integration tests timed out together). Cap their concurrency.
[test-groups]
process-spawners = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary_id(sema-dap::integration_test) | test(/runtime_mcp_.*_cancellable/)'
test-group = 'process-spawners'

[profile.ci]
# Emit JUnit XML for CI test reporting.
retries = 1
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"

# Windows leg (nightly.yml). retries=0: while the leg is red, retrying hung
# tests doubles the timeout tail (9 pty timeouts x 2 tries once cost ~36 min of
# a 44-minute job). default-filter drops the Unix-only pty suites — the
# `proc_pty_async_test` module of the async_suite binary and sema-stdlib's
# `pty::` unit tests — since subprocess eager-cancel is a documented no-op off
# Unix, they can only ever time out there (anchored regexes: a bare /pty/
# would also exclude every test with "empty" in its name). Keeps the
# slow-timeout hang watchdog.
[profile.ci-windows]
retries = 0
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }
default-filter = "not (test(/^proc_pty_async_test::/) | (package(sema-stdlib) & test(/^pty::/)))"

[profile.ci-windows.junit]
path = "junit.xml"
