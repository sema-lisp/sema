# Thin caller: the actual gate lives in verify.yml (one definition, shared with
# the publish workflow) so push CI and the publish gate cannot drift. The
# Windows and coverage legs run on a schedule instead (nightly.yml) — neither
# gates anything, and together they tripled this workflow's wall clock.
name: CI

# Docs/website-only pushes can't affect the gate, with two carve-outs for
# docs-located files that tests consume: crates/sema-docs/entries/*.md feeds
# the docs-check gate (covered — crates/** isn't ignored) and
# docs/plans/evidence/** holds the runtime-conformance inventory TSVs (the
# `!`-exception below; `paths` with negations, not `paths-ignore`, because
# only `paths` supports exceptions).
on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    paths:
      - "**"
      - "!docs/**"
      - "docs/plans/evidence/**"
      - "!website/**"
      - "!CHANGELOG.md"
      - "!README.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "docs/plans/evidence/**"
      - "!website/**"
      - "!CHANGELOG.md"
      - "!README.md"

# Superseded pushes stop burning runners. Scoped to this workflow only — the
# publish workflow's verify call runs inside its own run and must never be
# cancelled mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
