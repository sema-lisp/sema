# Notarize the signed macOS release binaries with Apple's notary service.
#
# Custom cargo-dist job, wired in via `post-announce-jobs = ["./notarize"]` in
# dist-workspace.toml, so it runs once the GitHub release exists. dist's
# built-in macos-sign covers signing only — notarization is explicitly future
# work upstream (cargo-dist src/sign/macos.rs), hence this job.
#
# Bare Mach-O binaries cannot be stapled (only .app/.dmg/.pkg bundles can), so
# this job never modifies a release asset: it submits the already-published,
# signed binaries to Apple, which registers their CDHashes with the notary
# service. Gatekeeper then fetches the notarization ticket online on first
# launch of a quarantined download. Archive checksums, dist-manifest.json and
# the Homebrew formula all stay valid.
#
# Requires repo secrets (setup guide: docs/release-signing.md):
#   APPLE_API_KEY_P8     — App Store Connect API key (.p8 file contents)
#   APPLE_API_KEY_ID     — its key ID
#   APPLE_API_ISSUER_ID  — its issuer UUID
# When the secrets are absent the job succeeds with a notice, so releases keep
# working (signed but not notarized) until notarization is configured.

name: Notarize macOS binaries

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  notarize:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check notarization secrets
        id: creds
        env:
          CONFIGURED: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
        run: |
          echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
          if [ "$CONFIGURED" != "true" ]; then
            echo "::notice::APPLE_API_* secrets not configured — binaries ship signed but not notarized. See docs/release-signing.md."
          fi

      - name: Download macOS release artifacts
        if: steps.creds.outputs.configured == 'true'
        env:
          TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-apple-darwin.tar.xz'
          ls -l ./*-apple-darwin.tar.xz

      - name: Submit to the Apple notary service
        if: steps.creds.outputs.configured == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_file"
          notary=(--key "$key_file" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")

          failed=0
          for archive in *-apple-darwin.tar.xz; do
            dir="${archive%.tar.xz}"
            tar -xJf "$archive"
            bin="$dir/sema"

            # A submission without a Developer ID signature + hardened runtime is
            # guaranteed Invalid — fail with a diagnosis instead of Apple's.
            codesign --verify --strict "$bin"
            info="$(codesign --display --verbose "$bin" 2>&1)"
            if ! grep -q 'flags=.*runtime' <<<"$info"; then
              echo "::error::$archive: binary lacks a hardened-runtime signature (CODESIGN_* secrets or CODESIGN_OPTIONS missing at build time?)"
              echo "$info"
              failed=1
              continue
            fi

            # notarytool takes zip/pkg/dmg, not tar.xz; the zip is submission-only.
            # --norsrc keeps xattr AppleDouble (._sema) files out of it.
            ditto -c -k --norsrc "$bin" "$dir.zip"
            echo "Submitting $dir.zip"
            xcrun notarytool submit "$dir.zip" "${notary[@]}" \
              --wait --timeout 30m --output-format json | tee "$dir.result.json" || true

            status="$(jq -r '.status // "unknown"' "$dir.result.json" 2>/dev/null || echo unknown)"
            if [ "$status" = "Accepted" ]; then
              echo "$archive: notarization accepted"
            else
              echo "::error::$archive: notarization status '$status'"
              sub_id="$(jq -r '.id // empty' "$dir.result.json" 2>/dev/null || true)"
              if [ -n "$sub_id" ]; then
                xcrun notarytool log "$sub_id" "${notary[@]}" || true
              fi
              failed=1
            fi
          done
          exit "$failed"
