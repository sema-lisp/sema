# Notarize the signed workflow artifacts before publication.
# Bare executables cannot be stapled; submission does not modify the artifacts.
name: Notarize macOS binaries

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  notarize:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: artifacts-build-local-*-apple-darwin
          path: artifacts
          merge-multiple: true
      - name: Require notarization credentials
        env:
          CONFIGURED: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
        run: test "$CONFIGURED" = true

      - name: Submit to the Apple notary service
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        working-directory: artifacts
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          notary=(--key "$key_file" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")

          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -xJf "sema-lang-$target.tar.xz"
          done
          mkdir universal
          lipo -create sema-lang-{aarch64,x86_64}-apple-darwin/sema -output universal/sema
          failed=0
          for dir in sema-lang-aarch64-apple-darwin sema-lang-x86_64-apple-darwin universal; do
            bin="$dir/sema"

            # A submission without a Developer ID signature + hardened runtime is
            # guaranteed Invalid — fail with a diagnosis instead of Apple's.
            codesign --verify --strict --all-architectures "$bin"
            info="$(codesign --display --verbose "$bin" 2>&1)"
            if ! grep -q 'flags=.*runtime' <<<"$info"; then
              echo "::error::$dir: binary lacks a hardened-runtime signature (CODESIGN_* secrets or CODESIGN_OPTIONS missing at build time?)"
              echo "$info"
              failed=1
              continue
            fi

            # notarytool takes zip/pkg/dmg, not tar.xz; the zip is submission-only.
            # --norsrc keeps xattr AppleDouble (._sema) files out of it.
            ditto -c -k --norsrc "$bin" "$dir.zip"
            echo "Submitting $dir.zip"
            xcrun notarytool submit "$dir.zip" "${notary[@]}" \
              --wait --timeout 30m --output-format json | tee "$dir.result.json" || true

            status="$(jq -r '.status // "unknown"' "$dir.result.json" 2>/dev/null || echo unknown)"
            if [ "$status" = "Accepted" ]; then
              echo "$dir: notarization accepted"
            else
              echo "::error::$dir: notarization status '$status'"
              sub_id="$(jq -r '.id // empty' "$dir.result.json" 2>/dev/null || true)"
              if [ -n "$sub_id" ]; then
                xcrun notarytool log "$sub_id" "${notary[@]}" || true
              fi
              failed=1
            fi
          done
          exit "$failed"

      - name: Save notarization results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-notarization-results
          path: artifacts/*.result.json
          if-no-files-found: error
