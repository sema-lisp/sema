# Publish to crates.io + npm when a version tag is pushed — one pipeline, one
# verify gate.
#
# NOTE: npm Trusted Publishing (OIDC) whitelists this workflow's *filename*.
# The file MUST stay `publish-npm.yml` even though it now publishes both
# registries — renaming it breaks the OIDC match (the npm publish 404s with
# "you do not have permission"). crates.io uses a token and has no filename
# constraint, which is why its job could move in here (it used to be a separate
# publish.yml whose own verify call doubled the gate cost per tag).
#
# Usage:
#   1. Bump the version in Cargo.toml (workspace.package.version + dependency pins)
#   2. Commit and push
#   3. Tag and push:  git tag v1.6.2 && git push origin v1.6.2
#
# Recover a partially-failed publish:  re-run via workflow_dispatch against main
# (the crates publish loop is idempotent — already-published crates are skipped —
# and the npm publishes skip already-published versions).
#
# Setup: crates.io API token -> secret CARGO_REGISTRY_TOKEN.

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # allow re-running a partially-failed publish against main

jobs:
  # A red suite blocks BOTH publishes.
  verify:
    uses: ./.github/workflows/verify.yml

  publish-crates:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # sema-stdlib pulls in serialport -> libudev-sys, whose `cargo publish`
      # verify-build needs libudev. Without this the last three crates fail to
      # publish (and the old loop masked it as "already published").
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      # Warms the third-party deps for the 16 sequential `cargo publish`
      # verify-builds, which ran fully cold before (~7 min).
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e

          # Idempotent: skip crates already on crates.io, but FAIL LOUDLY on any
          # other error (a real publish failure must not look like success).
          # `cargo publish` already blocks until the new version is available on
          # the index, so no extra sleep is needed between crates.
          publish() {
            echo "Publishing $1..."
            out=$(cargo publish -p "$1" 2>&1) && { echo "$out"; return 0; }
            if echo "$out" | grep -qiE "already (uploaded|exists)"; then
              echo "$1 already published, skipping"
            else
              echo "$out"
              echo "::error::Publishing $1 failed"
              exit 1
            fi
          }

          # Dependency order: a crate's path-deps must already be on crates.io.
          publish sema-core
          publish sema-io
          publish sema-reader
          publish sema-fmt
          publish sema-vm
          publish sema-codegen
          publish sema-otel
          publish sema-policy
          publish sema-workflow
          publish sema-llm
          publish sema-stdlib
          publish sema-eval
          publish sema-docs
          publish sema-dap
          publish sema-notebook
          publish sema-lsp
          publish sema-mcp
          publish sema-lang

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Warms the wasm release deps (the build ran fully cold before, ~2.5 min).
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Pinned binary install, matching every other workflow (the curl
      # installer floated whatever version was current).
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm 11.x — supports `--provenance` and trusted
          # publishing. Earlier runner images (Node 22.22.2) shipped a
          # corrupted bundled npm whose `arborist` was missing `promise-retry`,
          # making both `npm install -g npm@latest` and `npm publish` fail.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm is functional
        run: |
          node --version
          npm --version

      - name: Determine version
        id: version
        run: |
          # Tag push uses the tag; workflow_dispatch (recovery) reads Cargo.toml.
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi

      # Through the shared script with the same flags as `jake wasm.js-lib-build`
      # (the build every suite tests): --remap-path-prefix so the published wasm
      # doesn't embed the runner's absolute paths, and opt-level=s like every
      # other shipped wasm artifact. The old raw `wasm-pack build` here shipped
      # a fourth flag-variant no suite exercised, with builder paths leaked in.
      - name: Build WASM package
        run: ./scripts/wasm-build.sh crates/sema-wasm --target web --release --scope sema-lang --out-dir ../../packages/sema-wasm/pkg -- --config 'profile.release.package.sema-wasm.opt-level="s"'

      - name: Prepare sema-wasm package
        working-directory: packages/sema-wasm/pkg
        run: |
          # wasm-pack generates package.json; update version to match tag
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          # Copy README
          cp ../README.md .

      - name: Publish @sema-lang/sema-wasm
        working-directory: packages/sema-wasm/pkg
        run: npm publish --provenance --access public || echo "Already published, skipping"

      - name: Wait for npm registry propagation
        run: |
          echo "Waiting for @sema-lang/sema-wasm@${{ steps.version.outputs.version }} to propagate..."
          for i in $(seq 1 30); do
            if npm view "@sema-lang/sema-wasm@${{ steps.version.outputs.version }}" version 2>/dev/null; then
              echo "Package available on registry"
              exit 0
            fi
            echo "Attempt $i/30 - not yet available, waiting 10s..."
            sleep 10
          done
          echo "Package not found after 5 minutes"
          exit 1

      - name: Build wrapper package
        working-directory: packages/sema
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          # Update dependency version to match
          node -e "
            const pkg = require('./package.json');
            pkg.dependencies['@sema-lang/sema-wasm'] = '^${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install
          npm run build

      - name: Publish @sema-lang/sema
        working-directory: packages/sema
        run: npm publish --provenance --access public || echo "Already published, skipping"

      # Standalone TS packages — version-locked to the workspace release, built and
      # published with provenance via the same OIDC trusted publisher.
      - name: Publish @sema-lang/llm-proxy
        working-directory: packages/llm-proxy
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm install
          npm run build
          npm publish --provenance --access public || echo "Already published, skipping"

      - name: Publish @sema-lang/sema-web
        working-directory: packages/sema-web
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm install
          npm run build
          npm publish --provenance --access public || echo "Already published, skipping"
