name: sema-web tests
on:
  push:
    # branches (not tags): a release tag is the same commit that already ran on
    # the main push, and the release gate is verify.yml — a second identical
    # run here added ~8 runner-minutes per tag for nothing.
    branches: [main]
    paths:
      - ".github/workflows/sema-web-tests.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      # crates/sema: the archive-loading e2e test shells `cargo run -p
      # sema-lang -- build`, so the CLI crate is a real input here.
      - "crates/sema/**"
      - "crates/sema-core/**"
      - "crates/sema-eval/**"
      - "crates/sema-fmt/**"
      - "crates/sema-otel/**"
      - "crates/sema-reader/**"
      - "crates/sema-stdlib/**"
      - "crates/sema-vm/**"
      - "crates/sema-wasm/**"
      - "package-lock.json"
      - "packages/llm-proxy/**"
      - "packages/sema-web/**"
      - "packages/sema/**"
      - "packages/sema-wasm/**"
  pull_request:
    paths:
      - ".github/workflows/sema-web-tests.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/sema/**"
      - "crates/sema-core/**"
      - "crates/sema-eval/**"
      - "crates/sema-fmt/**"
      - "crates/sema-otel/**"
      - "crates/sema-reader/**"
      - "crates/sema-stdlib/**"
      - "crates/sema-vm/**"
      - "crates/sema-wasm/**"
      - "package-lock.json"
      - "packages/llm-proxy/**"
      - "packages/sema-web/**"
      - "packages/sema/**"
      - "packages/sema-wasm/**"

concurrency:
  group: sema-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job for unit + e2e: the old split pair each paid full checkout, wasm
  # restore, npm ci, and workspace builds, serialized behind each other. Steps
  # still run vitest before playwright, so unit failures stop the run first.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The archive-loading e2e test shells out to `cargo run -p sema-lang --
      # build`, which compiles the native binary. That pulls in `serialport`
      # (transitive `libudev-sys`), which needs libudev-dev on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # For the native `cargo run -p sema-lang` build in the e2e specs — it was
      # cold on every run before.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Pinned binary install, matching playground-runtime.yml. The old
      # `cargo install wasm-pack` compiled wasm-pack itself from source
      # (~1.4 min) on every wasm-cache miss.
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      # The WASM binary is gitignored, and three suites — component-sema,
      # resource-sema, and the `renderSema` harness — gate themselves on it
      # rather than failing a checkout that has not been built. Without this
      # build they would skip and report green having run nothing.
      - uses: actions/cache@v4
        id: wasm-cache
        with:
          path: packages/sema-wasm/pkg
          key: wasm-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/sema-core/**', 'crates/sema-eval/**', 'crates/sema-fmt/**', 'crates/sema-otel/**', 'crates/sema-reader/**', 'crates/sema-stdlib/**', 'crates/sema-vm/**', 'crates/sema-wasm/**') }}
      # Through the shared script (not wasm-pack directly) so this build gets
      # the same path remapping as every other wasm build in the repo.
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        name: Build the WASM package
        run: ./scripts/wasm-build.sh crates/sema-wasm --target web --out-dir ../../packages/sema-wasm/pkg

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # `dist/` is gitignored too, and `tests/testing-entry.test.ts` reads it to
      # prove the runtime bundle stayed free of the test-only entry point.
      - run: npm run build --workspace=@sema-lang/sema
      - run: npm run build --workspace=@sema-lang/sema-web

      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: packages/sema-web

      - run: npx vitest run
        working-directory: packages/sema-web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium
        working-directory: packages/sema-web

      - run: npx playwright test
        working-directory: packages/sema-web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/sema-web/playwright-report/
