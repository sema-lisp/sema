name: Test macOS Signing & Notarization

on:
  workflow_dispatch:
  push:
    branches: [ci/macos-sign]

jobs:
  test-signing:
    runs-on: macos-latest
    env:
      CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
      CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check secrets exist
        run: |
          missing=""
          [ -n "$CODESIGN_CERTIFICATE" ] || missing="$missing CODESIGN_CERTIFICATE"
          [ -n "$CODESIGN_CERTIFICATE_PASSWORD" ] || missing="$missing CODESIGN_CERTIFICATE_PASSWORD"
          [ -n "$CODESIGN_IDENTITY" ] || missing="$missing CODESIGN_IDENTITY"
          [ -n "$APPLE_API_KEY_P8" ] || missing="$missing APPLE_API_KEY_P8"
          [ -n "$APPLE_API_KEY_ID" ] || missing="$missing APPLE_API_KEY_ID"
          [ -n "$APPLE_API_ISSUER_ID" ] || missing="$missing APPLE_API_ISSUER_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
          echo "All 6 secrets present"

      - name: Import signing certificate
        run: |
          set -euo pipefail
          signing_keychain="$RUNNER_TEMP/sema-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert_path="$RUNNER_TEMP/sema-signing.p12"

          printf '%s' "$CODESIGN_CERTIFICATE" | base64 -d > "$cert_path"

          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 7200 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"

          # Add to keychain search list
          existing_keychains=()
          while read -r kc; do
            kc="${kc//\"/}"
            [ -n "$kc" ] && existing_keychains+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$signing_keychain" "${existing_keychains[@]}"

          security import "$cert_path" \
            -k "$signing_keychain" \
            -f pkcs12 \
            -P "$CODESIGN_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$signing_keychain"

          echo "SIGNING_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          echo "CERT_PATH=$cert_path" >> "$GITHUB_ENV"

          echo "Verifying identity: $CODESIGN_IDENTITY"
          security find-identity -v -p codesigning "$signing_keychain" | tee /dev/stderr | grep -q "$CODESIGN_IDENTITY"
          echo "Certificate imported successfully"

      - name: Build sema
        run: |
          cargo build --release --features otel-grpc
          ls -l target/release/sema

      - name: Sign sema binary
        run: |
          set -euo pipefail
          binary=target/release/sema

          echo "Signing $binary with hardened runtime + timestamp"
          codesign --force \
            --sign "$CODESIGN_IDENTITY" \
            --keychain "$SIGNING_KEYCHAIN" \
            --options runtime \
            --timestamp \
            "$binary"

          echo "=== codesign --verify --strict ==="
          codesign --verify --strict --verbose=4 "$binary" 2>&1

          echo "=== codesign -dvv ==="
          codesign -dvv "$binary" 2>&1

          echo "=== Signature flags check ==="
          info="$(codesign -dvv "$binary" 2>&1)"
          echo "$info"

          if grep -q 'flags=.*runtime' <<<"$info"; then
            echo "PASS: binary has hardened runtime flag"
          else
            echo "::error::FAIL: binary lacks hardened runtime flag"
            exit 1
          fi

          if grep -q 'Authority=Developer ID Application' <<<"$info"; then
            echo "PASS: signed with Developer ID Application cert"
          else
            echo "::error::FAIL: not signed with a Developer ID cert"
            exit 1
          fi

          echo "Signing successful"

      - name: Test notarization submission
        run: |
          set -euo pipefail
          binary=target/release/sema
          key_file="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_file"

          # Create a zip for submission (required by notarytool)
          ditto -c -k --norsrc "$binary" "$RUNNER_TEMP/sema.zip"

          echo "Submitting to notarization"
          xcrun notarytool submit "$RUNNER_TEMP/sema.zip" \
            --key "$key_file" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 15m --output-format json \
            | tee "$RUNNER_TEMP/notarization-result.json"

          status="$(jq -r '.status // "unknown"' "$RUNNER_TEMP/notarization-result.json" 2>/dev/null || echo unknown)"
          echo "Notarization status: $status"

          if [ "$status" = "Accepted" ]; then
            echo "PASS: notarization accepted"
          else
            echo "::error::Notarization status: $status"
            sub_id="$(jq -r '.id // empty' "$RUNNER_TEMP/notarization-result.json" 2>/dev/null || true)"
            if [ -n "$sub_id" ]; then
              echo "=== Notarization log ==="
              xcrun notarytool log "$sub_id" \
                --key "$key_file" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" 2>&1 || true
            fi
            exit 1
          fi

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          fi
