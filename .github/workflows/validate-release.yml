# Generated by scripts/generate-release-validation.py from release.yml.
# Run dist generate first, then this script. No hosting or publishing jobs.
name: Validate release artifacts
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag-flag: ${{ steps.plan.outputs.tag-flag }}
      publishing: 'false'
    steps:
      - uses: actions/checkout@v7
      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.4/cargo-dist-installer.sh | sh
      - name: Plan without creating a release
        id: plan
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "sema-lang") | .version')
          dist plan --tag "v$version" --output-format=json > plan.json
          jq '.ci.github.pr_run_mode = "upload" | .ci.github.artifacts_matrix.include |= map(select(any(.targets[]; endswith("apple-darwin"))))' plan.json > macos-plan.json
          echo "manifest=$(jq -c . macos-plan.json)" >> "$GITHUB_OUTPUT"
          echo "tag-flag=--tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Validated source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
      CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
    permissions:
      "contents": "read"
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: "codesign: hardened runtime on macOS signatures"
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "CODESIGN_OPTIONS=runtime" >> "$GITHUB_ENV"
          fi
        shell: "bash"
      - name: "Gate: committed web runtime is fresh"
        if: "runner.os != 'Windows'"
        run: "./scripts/check-web-runtime-fresh.sh"
        shell: "bash"
      - name: "PGO: generate profile (native targets only)"
        run: |
          set +e
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          # Local build jobs build exactly one target; global/installer jobs have none.
          if [ "$PGO_TARGETS" != "$HOST" ]; then
            echo "PGO: target '$PGO_TARGETS' != host '$HOST' — skipping (cross-compile or non-build job); plain LTO build."
            exit 0
          fi
          # PGO only on Linux/macOS. Windows git-bash yields POSIX paths (/d/a/...) that
          # the native MSVC rustc rejects in -Cprofile-use, and that failure lands in
          # dist build (not fail-safe). Windows ships a plain LTO build.
          case "$(uname -s)" in
            Linux|Darwin) ;;
            *) echo "PGO: $(uname -s) unsupported for PGO here — skipping; plain LTO build."; exit 0 ;;
          esac
          # This step runs BEFORE dist's own "Install dependencies" step, so the build
          # deps it declares (apt: libudev-dev) aren't present yet — install them here
          # or the instrumented build fails on libudev-sys.
          if [ "$(uname)" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libudev-dev pkg-config
            if [ $? -ne 0 ]; then echo "PGO: apt build deps failed — skipping."; exit 0; fi
          fi
          rustup component add llvm-tools-preview
          if [ $? -ne 0 ]; then echo "PGO: llvm-tools unavailable — skipping."; exit 0; fi
          PROFILE=dist ./scripts/pgo-build.sh --profile-only
          if [ $? -ne 0 ] || [ ! -f target/pgo/merged.profdata ]; then
            echo "PGO: profile generation failed — skipping; plain LTO build."
            exit 0
          fi
          echo "RUSTFLAGS=-Cprofile-use=$(pwd)/target/pgo/merged.profdata -Cllvm-args=-pgo-warn-missing-function" >> "$GITHUB_ENV"
          echo "PGO: profile ready ($(du -h target/pgo/merged.profdata | cut -f1)); dist build will consume it."
        shell: "bash"
        env:
          "PGO_TARGETS": "${{ join(matrix.targets, ' ') }}"
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  check-macos:
    needs: [plan, build-local-artifacts]
    uses: ./.github/workflows/check-macos-artifacts.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
