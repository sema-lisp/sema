[workspace]
members = [
    "crates/sema-core",
    "crates/sema-io",
    "crates/sema-reader",
    "crates/sema-eval",
    "crates/sema-llm",
    "crates/sema-stdlib",
    "crates/sema-vm",
    "crates/sema",
    "crates/sema-wasm",
    "crates/sema-fmt",
    "crates/sema-lsp",
    "crates/sema-dap",
    "crates/sema-notebook",
    "crates/sema-docs",
    "crates/sema-mcp",
    "crates/sema-otel",
    "crates/sema-policy",
    "crates/sema-workflow",
]
resolver = "2"
# One-shot generator for the PIO golden fixture; deliberately outside the workspace
# so its pio/lalrpop proc-macro stack never joins normal builds (see the tool's docs).
exclude = ["tools/pio-golden"]

# What a bare `cargo build` / `cargo test` builds. Excludes only sema-wasm: it is
# wasm32-only in practice (built via jake wasm.* with --target wasm32-unknown-unknown),
# and compiling it for the host drags js-sys/web-sys/wasm-bindgen (~25s of serial
# compile) into every native build. Build it explicitly with -p sema-wasm.
default-members = [
    "crates/sema-core",
    "crates/sema-io",
    "crates/sema-reader",
    "crates/sema-eval",
    "crates/sema-llm",
    "crates/sema-stdlib",
    "crates/sema-vm",
    "crates/sema",
    "crates/sema-fmt",
    "crates/sema-lsp",
    "crates/sema-dap",
    "crates/sema-notebook",
    "crates/sema-docs",
    "crates/sema-mcp",
    "crates/sema-otel",
    "crates/sema-policy",
    "crates/sema-workflow",
]

[workspace.package]
version = "1.35.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sema-lisp/sema"
homepage = "https://sema-lang.com"

[workspace.dependencies]
sema-core = { version = "=1.35.0", path = "crates/sema-core" }
sema-io = { version = "=1.35.0", path = "crates/sema-io" }
sema-reader = { version = "=1.35.0", path = "crates/sema-reader" }
sema-eval = { version = "=1.35.0", path = "crates/sema-eval" }
sema-llm = { version = "=1.35.0", path = "crates/sema-llm" }
sema-stdlib = { version = "=1.35.0", path = "crates/sema-stdlib" }
sema-vm = { version = "=1.35.0", path = "crates/sema-vm" }
sema-fmt = { version = "=1.35.0", path = "crates/sema-fmt" }
sema-lsp = { version = "=1.35.0", path = "crates/sema-lsp" }
sema-dap = { version = "=1.35.0", path = "crates/sema-dap" }
sema-notebook = { version = "=1.35.0", path = "crates/sema-notebook" }
sema-docs = { version = "=1.35.0", path = "crates/sema-docs" }
sema-mcp = { version = "=1.35.0", path = "crates/sema-mcp" }
sema-otel = { version = "=1.35.0", path = "crates/sema-otel" }
sema-policy = { version = "=1.35.0", path = "crates/sema-policy" }
sema-workflow = { version = "=1.35.0", path = "crates/sema-workflow" }

tower-lsp = "0.20"
dashmap = "6"

regex = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-std", "io-util", "process", "time"] }
# rustls-no-provider instead of the default `rustls` feature: the default pins the
# aws-lc-rs crypto provider, whose aws-lc-sys build script alone costs ~43s (the
# single slowest unit in the whole graph). The pure-Rust ring provider is enabled
# instead via the direct rustls dependency below (sema-llm/sema-stdlib): with
# exactly one provider feature in the unified graph, rustls auto-selects it as the
# process default, so no runtime install is required. If a second provider feature
# ever sneaks into the graph, that auto-selection stops and reqwest Client
# construction panics — sema_llm::http::ensure_crypto_provider() pins ring
# explicitly on the LLM path, and `cargo tree -i aws-lc-sys` must stay empty.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "json", "stream", "blocking", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
ring = "0.17"
chrono = "0.4"
csv = "1"
md5 = "0.8"
hmac = "0.12"
hex = "0.4"
lasso = "0.7"
hashbrown = "0.17"
smallvec = "1"
unicode-normalization = "0.1"
unicode-width = "0.1"
unicode-segmentation = "1"
caseless = "0.2"
glob = "0.3"
globset = "0.4"
hostname = "0.4"
libc = "0.2"
pdf-extract = "0.12"
# default features off: drops jiff/chrono/time/rayon (~15s of transitive compile);
# Document::load/get_pages/Info-dict need none of them.
lopdf = { version = "0.42", default-features = false }
axum = { version = "0.8", features = ["ws"] }
tokio-stream = "0.1"
mime_guess = "2"
toml = "1.1"
toml_edit = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
semver = "1"
tar = "0.4"
flate2 = "1"
crc32fast = "1"
# minimal features: deflate covers ~all real zips, deflate64 the Windows-Explorer
# variant. Trade-off: zstd/bzip2/AES-encrypted archives error at runtime.
zip = { version = "8", default-features = false, features = ["deflate", "deflate64"] }
similar = "2"
pulldown-cmark = "0.12"
scraper = "0.21"
notify = "6"
self-replace = "1"
indicatif = "0.18"
portable-pty = "0.9"

# MCP client OAuth (native, hand-rolled per Option B). oauth2 provides PKCE-S256
# + code/refresh exchange; we drive it with our own reqwest client. tiny_http is
# the lean loopback-redirect listener; webbrowser opens the system browser;
# keyring is the OS keychain (with a 0600-file fallback we implement). directories
# resolves the config dir. Platform-native keyring backends avoid extra system
# libs (no dbus) so CI builds stay green.
oauth2 = { version = "5", default-features = false }
url = "2"
tiny_http = "0.12"
webbrowser = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
directories = "6"

# AEAD for scoped file-backed MCP token stores (workflow-mcp-auth plan §4): wraps
# the on-disk credential JSON so a leaked .sema/auth/*.json (or .sema/runs/*/auth/)
# file is useless without the encryption key, which never sits next to the
# ciphertext (env var or OS keyring instead).
chacha20poly1305 = "0.11"

wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"
getrandom = "0.4"


# Dev/test builds: keep file:line backtraces but drop variable-level debug info.
# Shrinks test binaries (~84MB -> ~25MB) and the incremental cache substantially.
# Does NOT affect benchmarking (uses [profile.release]) or profiling (uses
# [profile.release-with-debug], which keeps full symbols).
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
