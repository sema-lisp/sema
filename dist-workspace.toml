[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.4"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "helgesverre/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Validate the signed macOS archives before GitHub/Homebrew publication.
global-artifacts-jobs = ["./check-macos-artifacts"]
# Sign macOS binaries with a Developer ID certificate (CODESIGN_* repo secrets;
# see docs/release-signing.md). Builds stay unsigned when the secrets are absent.
macos-sign = true
# Notarize the signed macOS binaries after the release is published
# (.github/workflows/notarize.yml; APPLE_API_* repo secrets).
post-announce-jobs = ["./notarize"]
# Sigstore provenance for every release artifact (all targets, not just macOS):
# proves it was built by this repo's release workflow at a specific commit.
# Verify with `gh attestation verify <artifact> --owner sema-lisp`. No secrets
# needed — keyless signing via the workflow's OIDC identity.
github-attestations = true
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Release binaries keep OTLP-over-gRPC support; it is a non-default cargo feature so
# dev builds skip the tonic/h2 compile (see docs/build-time-report.md).
features = ["otel-grpc"]
# Steps injected into build-local-artifacts before `dist build`: PGO
# (instrument+train+profile-use on native targets) and the macOS codesign
# options. Steps live in .github/build-setup.yml; run `dist generate` after
# editing them.
github-build-setup = "../build-setup.yml"
# Don't run the `plan` job on every PR — verify.yml is the real PR gate, and
# dist config changes are rare enough to be exercised at tag time.
pr-run-mode = "skip"

# Build the Apple Silicon target on macos-15 rather than dist's default
# macos-14-arm64. The signing certificate is a PKCS#12 file whose MAC uses SHA-256
# (the OpenSSL 3 default); macOS 14's `security import` cannot verify that MAC and
# fails with "MAC verification failed during PKCS12 import (wrong password?)", which
# stopped the v1.34.1 aarch64-apple-darwin build. The same secrets import correctly
# on macos-15, which already builds the x86_64 target.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

# System dependencies — libudev is required by `serialport` (transitively libudev-sys) on Linux.
[dist.dependencies.apt]
libudev-dev = "*"
